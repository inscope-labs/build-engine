# ctxgate read gateway: the production Class B context-read route (RELEASE-PLAN.md Stage 4.2).
#
# Hosting is decided: docs/decisions/0001 (Cloudflare Workers, operator-owned, single-tenant).
# This file is the deployed configuration. It carries NO secrets: the signing keys, the operator
# token and the repository credential are `wrangler secret put`, or .dev.vars locally.
name = "ctxgate-read"
main = "src/index.ts"

# Pin deliberately and bump on purpose; do not float.
compatibility_date = "2025-09-01"

# The gateway's state: the revocation set, the audit trail and the rate-limit counters.
# A Durable Object is used rather than KV because revocation must take effect immediately:
# a capability that is revoked must stop working at once, not up to a cache TTL later.
[[durable_objects.bindings]]
name = "STATE"
class_name = "GatewayState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GatewayState"]

# ---------------------------------------------------------------------------
# Non-secret configuration. Everything here is safe to read, but the values that
# describe the policy are ALSO reported on /healthz, so that a verifier can test
# the gateway as it is actually configured.
# ---------------------------------------------------------------------------
[vars]
GITHUB_API_BASE = "https://api.github.com"
# The single repository this gateway may read. One repository, one credential.
GITHUB_REPO = "OWNER/REPO"
# Which repository paths may be served. A prefix may end in '*' to match one path
# segment, e.g. "plans/*/package/". A prefix must end in '/'.
ALLOW_PREFIXES = "amk/,plans/*/package/"
# Deny patterns, as JSON array of regular expression sources. Compiled case-insensitively.
DENY_PATTERNS = "[\"(^|/)\\\\.git(/|$)\",\"(^|/)\\\\.github/\",\"(^|/)\\\\.env\",\"(^|/)(secrets?|credentials?)(\\\\.|/|$)\",\"\\\\.(pem|key|p12)$\",\"(^|/)__pycache__(/|$)\",\"\\\\.pyc$\"]"
# Largest file that may be served.
MAX_BYTES = "1048576"
# Longest lifetime a link may have. The operator's approved ceiling is 259200 (72 h).
MAX_TTL = "259200"
# Seconds the gateway's clock is assumed to lag the minter's. Approved ceiling: 120.
CLOCK_SKEW_TOLERANCE = "120"
# Bounded upstream call.
SOURCE_TIMEOUT_MS = "5000"
# Abuse controls, per 60 s window. A task may legitimately fetch many context files, so the
# per-order budget is generous; the per-IP and global budgets bound a flood. The refusal burst
# is the one that matters: it counts the refusals an order receives AFTER its link has proved
# itself, and puts that order in a cooldown when the count is exceeded. Refusals that happen
# before the signature is verified are never counted against an order - a forger must not be
# able to lock out a real order by naming it in a link it cannot prove. See ops/limits.md.
RATE_LIMIT_PER_ORDER = "120"
RATE_LIMIT_PER_IP = "600"
RATE_LIMIT_GLOBAL = "2000"
# Authenticated refusals for one order in a window before that order is put in a cooldown.
REFUSAL_BURST = "60"
REFUSAL_COOLDOWN_SECONDS = "300"
# How many audit records are kept. The audit trail is a bounded ring, not a log archive.
AUDIT_RETENTION = "500"

# routes / workers_dev are intentionally unset until a deployment decision is made.
