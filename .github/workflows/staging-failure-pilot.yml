# Run the failure and recovery pilot (ops/staging-failure-pilot.py), by hand.
#
# Stage 6.3 of RELEASE-PLAN.md is "Failure and recovery pilot". The pilot drives the shipped
# write gateway on the shipped Workers runtime against the **real** provider, with a fault
# injector between the two, and it is what turned "the workflow works" into "the workflow
# survives what happens to it".
#
# It runs from main only, and it writes only to the disposable estate (the `staging/submissions`
# branch). It is **repeatable**, unlike the Stage 6.2 signed leg: the seal and the revocation
# happen in the local Durable Object state, which the pilot clears before it starts, and the
# task folders it needs are seeded only if they are not there.
#
# The credential is the staging environment's WRITE_GH_TOKEN, and it never leaves the runner.
# Before anything is kept, the output is checked for the value of every secret; if one is found
# the output is discarded and the run fails.
name: staging-failure-pilot

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "why this run is happening (recorded in the run summary)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-failure-pilot
  cancel-in-progress: false

jobs:
  pilot:
    name: the failure and recovery pilot
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    steps:
      - name: Only main may run the pilot
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "this may only run from main, not from ${GITHUB_REF}"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gateway/write/package-lock.json

      - name: The gateway's dependencies
        working-directory: gateway/write
        run: npm ci

      - name: The fault injector's own tests
        run: python3 -m unittest discover -s ops -p 'test_*.py' -v

      - name: The pilot
        env:
          GITHUB_TOKEN: ${{ secrets.WRITE_GH_TOKEN }}
          READ_BASE: https://ctxgate-read-staging.qnuralink.workers.dev
          WRITE_BASE: https://ctxgate-write-staging.qnuralink.workers.dev
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN}" ]; then
            echo "the staging environment has no WRITE_GH_TOKEN; see docs/release/STAGING-PILOT.md"
            exit 1
          fi
          python3 ops/staging-failure-pilot.py 2>&1 | tee "$RUNNER_TEMP/pilot.txt"

      - name: No secret is in the output
        if: always()
        env:
          WRITE_GH_TOKEN: ${{ secrets.WRITE_GH_TOKEN }}
        run: |
          set -u
          out="$RUNNER_TEMP/pilot.txt"
          [ -f "$out" ] || exit 0
          val="${WRITE_GH_TOKEN:-}"
          if [ -n "$val" ] && grep -qF -- "$val" "$out"; then
            rm -f "$out"
            echo "the output contained the value of WRITE_GH_TOKEN: it was discarded and is not published"
            exit 1
          fi
          echo "no secret value appears in the output"

      - name: The run summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "## staging-failure-pilot"
            echo
            echo "Source commit: \`${GITHUB_SHA}\`"
            echo
            printf 'Reason: %s\n\n' "$REASON"
            if [ -f "$RUNNER_TEMP/pilot.txt" ]; then
              echo '```'
              tail -n 60 "$RUNNER_TEMP/pilot.txt" | sed 's/\x1b\[[0-9;]*m//g'
              echo '```'
            else
              echo "No output was kept."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-failure-pilot-${{ github.run_id }}
          path: ${{ runner.temp }}/pilot.txt
          if-no-files-found: ignore
          retention-days: 30
