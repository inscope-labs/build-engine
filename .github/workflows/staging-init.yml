# Initialise the staging Workers and their secrets, by hand, from the operator's own account.
#
# Run it from the Actions tab (Run workflow). It creates ctxgate-read-staging and
# ctxgate-write-staging if they do not exist, and sets SIGNING_KEYS, OPERATOR_TOKEN and
# GITHUB_TOKEN on each. It never touches production, and it never runs from a pull request.
#
# The generated values are not printed: they go into an encrypted artifact that only the
# holder of the delivery private key can read. See docs/release/STAGING-INIT.md.
name: staging-init

on:
  workflow_dispatch:
    inputs:
      target:
        description: "which staging Worker to initialise"
        type: choice
        options:
          - both
          - read
          - write
        default: both
      reason:
        description: "why (recorded in the run summary)"
        type: string
        required: true
      replace:
        description: "yes = replace secrets that already exist (invalidates every staging link and token)"
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: staging-init
  cancel-in-progress: false

jobs:
  init:
    name: initialise the staging Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The staging environment holds CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, READ_GH_TOKEN
    # and WRITE_GH_TOKEN. Add yourself as a required reviewer there if you want a pause.
    environment: staging
    steps:
      - name: Only a reviewed branch may run this
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "this may only run from main, not from ${GITHUB_REF}"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create the Workers if needed, and set their secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          READ_GH_TOKEN: ${{ secrets.READ_GH_TOKEN }}
          WRITE_GH_TOKEN: ${{ secrets.WRITE_GH_TOKEN }}
          DELIVERY_PUBLIC_KEY: ${{ vars.DELIVERY_PUBLIC_KEY }}
          WRANGLER_SEND_METRICS: "false"
          IN_TARGET: ${{ inputs.target }}
          IN_REASON: ${{ inputs.reason }}
          IN_REPLACE: ${{ inputs.replace }}
          OUT_DIR: ${{ runner.temp }}/staging-init-out
        run: bash ops/staging-init.sh --target "$IN_TARGET" --reason "$IN_REASON" --replace "$IN_REPLACE"

      - name: Run summary
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/staging-init-out/summary.md" ]; then
            cat "${RUNNER_TEMP}/staging-init-out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Encrypted delivery bundle
        uses: actions/upload-artifact@v4
        with:
          name: staging-secrets-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/staging-init-out/bundle.key.enc
            ${{ runner.temp }}/staging-init-out/bundle.json.enc
          retention-days: 1
          if-no-files-found: error
