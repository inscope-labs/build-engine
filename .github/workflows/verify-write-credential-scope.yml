# Verify what the PRODUCTION write credential can reach (S5 entry gate; ADR 0014).
#
# Asks GitHub, with the production environment's WRITE_GH_TOKEN, which repositories that credential
# can reach, and fails unless it reaches the submissions repository named in the write gateway's
# configuration and nothing else with write rights, and holds no write rights on the consumer
# repository. See ops/verify-write-credential-scope.py for the exact rules.
#
# It changes nothing: no deploy, no write to any repository. It is manual-only, runs only from main,
# and runs in the `production` environment so that its required reviewer decides every run. The
# token is not printed; the summary gives counts, not the names of unrelated repositories.
name: verify-write-credential-scope

on:
  workflow_dispatch:
    inputs:
      consumer_repo:
        description: "the plan's consumer (public upstream) repository, OWNER/REPO"
        type: string
        required: true
        default: "inscope-labs/acme-pilot"
      reason:
        description: "why (recorded in the run summary)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: verify-write-credential-scope
  cancel-in-progress: false

jobs:
  verify:
    name: the write credential reaches the submissions repository only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Only main may run this
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "this may only run from main, not from ${GITHUB_REF}"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check the credential's reach
        env:
          WRITE_GH_TOKEN: ${{ secrets.WRITE_GH_TOKEN }}
          IN_CONSUMER: ${{ inputs.consumer_repo }}
          OUT_FILE: ${{ runner.temp }}/write-credential-scope.md
        run: python3 ops/verify-write-credential-scope.py --consumer "$IN_CONSUMER"

      - name: Run summary
        if: always()
        env:
          IN_REASON: ${{ inputs.reason }}
        run: |
          {
            echo "reason: ${IN_REASON}"
            if [ -f "${RUNNER_TEMP}/write-credential-scope.md" ]; then
              cat "${RUNNER_TEMP}/write-credential-scope.md"
            else
              echo "the check did not produce a result"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
