# The deployed Workers' secret NAMES (S4 and S5's last BLOCKED-EXTERNAL condition).
#
# Each gateway's contract says which secrets its deployment holds: SIGNING_KEYS, OPERATOR_TOKEN
# and GITHUB_TOKEN. Whether a deployed Worker holds them is a fact only the Cloudflare API can
# answer, and the Cloudflare credential is deliberately NOT in the agent's environment (ADR 0013
# item 4). This workflow is how that fact is established without the agent ever holding it:
# the credential is read from the `production` environment, the API is asked for the NAMES, and
# the operator's required reviewer decides every run.
#
# It changes nothing: a read of two endpoints, no deploy, no write, no secret value (the API
# never returns one, and nothing here asks it to). It is manual-only and runs only from main.
#
# The check itself is ops/check-worker-secrets.py — the same code the gate's own check runs, so
# the two cannot drift.
name: worker secrets

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "why (recorded in the run summary)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: worker-secrets
  cancel-in-progress: false

jobs:
  check:
    name: the deployed Workers hold the secret names they must
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Only main may run this
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "this may only run from main, not from ${GITHUB_REF}"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: The production Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          rc=0
          for worker in ctxgate-write ctxgate-read; do
            echo "== $worker"
            python3 ops/check-worker-secrets.py --worker "$worker" \
              --expect SIGNING_KEYS OPERATOR_TOKEN GITHUB_TOKEN || rc=1
          done
          exit $rc

      - name: The staging Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          rc=0
          for worker in ctxgate-write-staging ctxgate-read-staging; do
            echo "== $worker"
            python3 ops/check-worker-secrets.py --worker "$worker" \
              --expect SIGNING_KEYS OPERATOR_TOKEN GITHUB_TOKEN || rc=1
          done
          exit $rc

      - name: Run summary
        if: always()
        env:
          IN_REASON: ${{ inputs.reason }}
        run: |
          {
            echo "reason: ${IN_REASON}"
            echo ""
            echo "the secret NAMES of each deployed Worker, and whether the contract's three are present"
            echo "(a secret's value is never returned by the API, and nothing here asks for one)"
          } >> "${GITHUB_STEP_SUMMARY}"
