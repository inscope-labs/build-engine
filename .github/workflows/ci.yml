name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shipped engine tests
        run: python3 -m unittest discover -s template/engine/tools -v
      - name: Gateway tests (never shipped)
        run: python3 -m unittest discover -s gateway/read/reference -p 'test_*.py' -v
      - name: Shell syntax
        run: |
          bash -n template/operator/cbridge
          sh -n template/operator/install.sh
          bash -n template/engine/bin/update.sh
          for f in release/*.sh tests/*.sh; do bash -n "$f"; done
      - name: Release machinery self-test
        run: release/test-release.sh
      - name: Consumer install and update flow
        run: tests/test_update.sh
      - name: Package and verify (dry run, no publish)
        run: |
          release/package.sh dist
          release/verify.sh "dist/build-engine-v$(tr -d ' \n' < VERSION).tar.gz"

  # The four write-gateway gates. They are four jobs and not one, because a gate that says which
  # half of the system is wrong is worth more than a gate that only says that something is.
  # The definitions are in gateway/write/ci/*.yml; GitHub only runs workflows from the root's
  # .github/workflows/, so the copies that run are here.

  write-gateway-lint:
    name: write gateway (typecheck, bundle, contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/write
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gateway/write/package-lock.json
      - run: npm ci
      - name: The typecheck, over three programs
        run: npm run typecheck
      - name: The bundle dry run (validates wrangler.toml and bundles the Worker; no deploy)
        run: npm run check:bundle
      - name: The contract documents agree with the code
        run: npm run check:contract

  write-gateway-unit:
    name: write gateway (unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gateway/write/package-lock.json
      - run: npm ci
      - name: The unit suite
        run: npm run test:unit

  write-gateway-integration:
    name: write gateway (integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gateway/write/package-lock.json
      - run: npm ci
      - name: The integration suite
        run: npm run test:integration

  write-gateway-deploy-gate:
    name: write gateway (log hygiene and the credential boundary)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/write
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gateway/write/package-lock.json
      - run: npm ci
      - name: The log hygiene and the credential boundary
        run: npm run verify:log-hygiene
      - name: The credential's reach in the code
        run: npm run check:token-scope -- --static
