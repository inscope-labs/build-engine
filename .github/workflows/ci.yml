name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shipped engine tests
        run: python3 -m unittest discover -s template/engine/tools -v
      - name: Gateway tests (never shipped)
        run: python3 -m unittest discover -s gateway/read/reference -p 'test_*.py' -v
      - name: Shell syntax
        run: |
          bash -n template/operator/cbridge
          sh -n template/operator/install.sh
          bash -n template/engine/bin/update.sh
          for f in release/*.sh tests/*.sh; do bash -n "$f"; done
      - name: Release machinery self-test
        run: release/test-release.sh
      - name: Consumer install and update flow
        run: tests/test_update.sh
      - name: Package and verify (dry run, no publish)
        # --test-payload runs the artifact's own test suite. The default verification never executes code
        # from the artifact; this job built the artifact itself in this same job, so it may run it.
        run: |
          release/package.sh dist
          release/verify.sh "dist/build-engine-v$(tr -d ' \n' < VERSION).tar.gz" --test-payload
  write-gateway:
    name: write gateway (typecheck + bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/write
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gateway/write/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Bundle dry run (validates wrangler.toml, no deploy, no credentials)
        run: npm run check:bundle
